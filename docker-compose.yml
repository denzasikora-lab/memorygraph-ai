services:
  cockroach:
    image: cockroachdb/cockroach:v25.2.0
    command: start-single-node --insecure --listen-addr=0.0.0.0
    ports: ["26257:26257", "8080:8080"]
    volumes: ["cockroach-data:/cockroach/cockroach-data"]
  api:
    build: .
    environment:
      MEMORYGRAPH_DATABASE_URL: postgresql+psycopg://root@cockroach:26257/defaultdb?sslmode=disable
      MEMORYGRAPH_MOCK_LLM: "true"
    depends_on: [cockroach]
    ports: ["8000:8000"]
volumes:
  cockroach-data:
